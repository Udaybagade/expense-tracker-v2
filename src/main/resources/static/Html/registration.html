<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
        }

        .container{
            width:420px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#2c3e50;
        }

        .input-group{
            margin-bottom:15px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:15px;
            outline:none;
        }

        input:focus{
            border-color:#667eea;
        }

        .error{
            color:red;
            font-size:13px;
            display:block;
            margin-top:4px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#667eea;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#5563d6;
        }

        #message{
            text-align:center;
            margin-top:15px;
            font-weight:bold;
        }

        .login-link{
            text-align:center;
            margin-top:15px;
        }

        .login-link a{
            text-decoration:none;
            color:#667eea;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

    </style>
</head>
<body>

<div class="container">

    <h2>📝 Create Account</h2>

    <form id="registerForm">

        <div class="input-group">
            <input
                    type="text"
                    id="name"
                    placeholder="Enter Name">
            <span id="nameError" class="error"></span>
        </div>

        <div class="input-group">
            <input
                    type="email"
                    id="email"
                    placeholder="Enter Email">
            <span id="emailError" class="error"></span>
        </div>

        <div class="input-group">
            <input
                    type="password"
                    id="password"
                    placeholder="Enter Password">
            <span id="passwordError" class="error"></span>
        </div>

        <button type="submit">
            Register
        </button>

    </form>

    <div id="message"></div>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script src="/js/register.js"></script>

</body>
</html>
