<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Dashboard</title>

    <style>

        /* RESET */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:#f4f7fc;
            min-height:100vh;
        }

        /* HEADER */
        header{
            background:linear-gradient(135deg,#667eea,#764ba2);
            color:white;
            padding:20px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        header h1{
            font-size:26px;
        }

        /* CONTAINER */
        .container{
            width:90%;
            max-width:1200px;
            margin:30px auto;
        }

        /* NAV */
        .nav{
            display:flex;
            gap:15px;
            margin-bottom:25px;
        }

        .nav a{
            text-decoration:none;
            padding:12px 18px;
            background:#3498db;
            color:white;
            border-radius:8px;
            transition:.3s;
            font-weight:600;
        }

        .nav a:hover{
            background:#2980b9;
        }

        /* CARDS */
        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card h2{
            color:#555;
            font-size:18px;
            margin-bottom:10px;
        }

        .amount{
            font-size:30px;
            font-weight:bold;
            color:#27ae60;
        }

        /* SECTION */
        .section{
            margin-top:35px;
        }

        .section h2{
            margin-bottom:15px;
            color:#2c3e50;
        }

        /* EXPENSE BOX */
        #recentList div{
            background:white;
            padding:15px;
            margin-bottom:12px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
            border-left:5px solid #3498db;
        }

        #recentList strong{
            color:#2c3e50;
        }

        #recentList small{
            color:#777;
        }

        /* BUTTON */
        #toggleBtn{
            padding:10px 15px;
            border:none;
            background:#3498db;
            color:white;
            border-radius:8px;
            cursor:pointer;
        }

        #toggleBtn:hover{
            background:#2980b9;
        }

        /* FOOTER */
        #footerActions{
            margin-top:30px;
            text-align:center;
        }

        #footerActions button{
            padding:12px 25px;
            background:#e74c3c;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        #footerActions button:hover{
            background:#c0392b;
        }

        /* RESPONSIVE */
        @media(max-width:768px){
            header{
                flex-direction:column;
                gap:10px;
            }

            .nav{
                flex-direction:column;
            }
        }

    </style>

</head>

<body>

<header>
    <h1>💰 Expense Tracker Dashboard</h1>
    <div id="headerActions"></div>
</header>

<div class="container">

    <div class="nav">
        <a href="/Html/expense.html">➕ Add Expense</a>
        <a href="/Html/category.html">📂 Add Categories</a>
    </div>

    <div class="cards">

        <div class="card">
            <h2>Total Expense</h2>
            <div class="amount" id="totalExpense">₹0</div>
        </div>

        <div class="card">
            <h2>This Month</h2>
            <div class="amount" id="monthlyExpense">₹0</div>
        </div>

        <div class="card">
            <h2>Total Categories</h2>
            <div class="amount" id="totalCategories">0</div>
        </div>

        <div class="card">
            <h2>Total Expenses</h2>
            <div class="amount" id="expenseCount">0</div>
        </div>

    </div>

    <div class="section">
        <h2>📌 Recent Activity</h2>

        <div id="recentList">Loading...</div>

        <div style="text-align:center; margin-top:15px;">
            <button id="toggleBtn">View All Activities</button>
        </div>
    </div>

    <div id="footerActions"></div>

</div>

<script src="/js/dashboard.js"></script>

</body>
</html>
