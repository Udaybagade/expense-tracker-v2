<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .container{
            width:400px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#2c3e50;
        }

        .input-group{
            margin-bottom:15px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:15px;
            outline:none;
        }

        input:focus{
            border-color:#3498db;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#3498db;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#2980b9;
        }

        #message{
            margin-top:15px;
            text-align:center;
            font-weight:bold;
        }

        .register-link{
            text-align:center;
            margin-top:15px;
        }

        .register-link a{
            color:#3498db;
            text-decoration:none;
        }

        .register-link a:hover{
            text-decoration:underline;
        }

    </style>
</head>
<body>

<div class="container">

    <h2>🔐 Expense Tracker Login</h2>

    <form id="loginForm">

        <div class="input-group">
            <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required>
        </div>

        <div class="input-group">
            <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="register-link">
        Don't have an account?
        <a href="registration.html">Register</a>
    </div>

</div>

<script src="/js/login.js"></script>

</body>
</html>
